name: Format JS and Search URL

on:
  workflow_dispatch: # GitHubのブラウザ画面から手動で実行できるようにします

jobs:
  format-and-grep:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prettierを使って、すべての .js ファイルを改行・整形する
      - name: Format JavaScript files
        run: |
          echo "=== MinifyされたJSファイルを整形中... ==="
          # npx prettier を使って、リポジトリ内のすべての .js ファイルを上書き整形します
          # (--write: ファイルを上書き, --log-level=warn: ログを静かにする)
          npx prettier --write "**/*.js" --log-level=warn || true

      # 3. 整形されたコードから、行番号付きでURLを検索する
      - name: Search for specific URL
        run: |
          echo "=== 整形後のファイルから検索を開始します ==="
          
          # 整形されたおかげで、URLがある「正確な行（前後のコード）」がログにきれいに表示されます
          grep -rn "https://extensions\.turbowarp\.org/generated-metadata/extensions-v0\.json" . || true
          
          echo "=== 検索が完了しました ==="
